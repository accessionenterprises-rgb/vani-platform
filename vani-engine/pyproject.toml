[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vani-engine"
version = "1.0.0"
description = "Vani — India-first voice AI engine"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[deepgram,google,openai,silero]~=1.5",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-cartesia~=1.5",
    "livekit-plugins-elevenlabs~=1.5",
    "livekit-plugins-dtln>=0.1",
    "httpx>=0.27",
    "python-dotenv",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
