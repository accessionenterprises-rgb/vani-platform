# Railway deployment config for vani-engine
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"

[deploy]
# Scale engine workers horizontally — each instance handles N concurrent calls.
# All instances compete for the same Redis queue (vani:queue:enterprise/standard).
# Safe to scale freely: stateless workers, Redis-backed job queue.
numReplicas        = 2
healthcheckPath    = "/health"
healthcheckTimeout = 30
restartPolicyType  = "always"

# Environment variables to set in Railway dashboard:
#   LIVEKIT_URL            — wss://your-project.livekit.cloud
#   LIVEKIT_API_KEY        — lkapi_...
#   LIVEKIT_API_SECRET     — your secret
#   ORCHESTRATOR_URL       — https://your-orchestrator.railway.app
#   OPENAI_API_KEY         — sk-...
#   SUPABASE_URL           — https://xxx.supabase.co
#   SUPABASE_SERVICE_KEY   — eyJ...
#   HEALTH_PORT            — 8080 (default, matches healthcheckPath above)
#
# Optional providers:
#   DEEPGRAM_API_KEY       — deepgram key
#   SARVAM_API_KEY         — Sarvam key
#   CARTESIA_API_KEY       — Cartesia key
#   ELEVENLABS_API_KEY     — ElevenLabs key
#   GROQ_API_KEY           — Groq key
#   CUSTOM_LLM_API_KEY     — key for custom LLM endpoint
