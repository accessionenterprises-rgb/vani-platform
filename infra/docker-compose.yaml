services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --node-ip 35.244.15.25

  livekit-sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    restart: always
    network_mode: host
    volumes:
      - ./sip-config.yaml:/sip/config.yaml
    depends_on:
      - livekit

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  vani-agent:
    build:
      context: /opt/vani-engine
      dockerfile: Dockerfile
    container_name: vani-agent
    restart: always
    network_mode: host
    env_file:
      - /opt/vani-engine/.env.local
    depends_on:
      - livekit

  vani-api:
    build:
      context: /opt/vani-api
      dockerfile: Dockerfile
    container_name: vani-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - /opt/vani-api/.env.local
    depends_on:
      - redis
