[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vani-orchestrator"
version = "1.0.0"
description = "Vani — Call Orchestrator"
requires-python = ">=3.10, <3.15"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis[asyncio]>=5.0",
    "supabase>=2.9",
    "pydantic-settings>=2.5",
    "livekit-api>=0.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "python-dotenv",
    "structlog>=24.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py310"
