# Railway deployment config for vani-orchestrator
# https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# 2 replicas = zero-downtime deploys + basic HA.
# Orchestrator is stateless (all state in Redis + Supabase) — safe to scale.
numReplicas        = 2
healthcheckPath    = "/health"
healthcheckTimeout = 30
restartPolicyType  = "always"

# Environment variables to set in Railway dashboard:
#   SUPABASE_URL           — https://xxx.supabase.co
#   SUPABASE_SERVICE_KEY   — eyJ...
#   REDIS_URL              — redis://... (Railway Redis plugin)
#   LIVEKIT_URL            — wss://your-project.livekit.cloud
#   LIVEKIT_API_KEY        — lkapi_...
#   LIVEKIT_API_SECRET     — your secret
#   ORCHESTRATOR_PUBLIC_URL— https://your-orchestrator.railway.app (Twilio callbacks)
#   ORCHESTRATOR_URL       — http://localhost:8001 or internal Railway URL
#   OPENAI_API_KEY         — for post-processing LLM analysis
#   TWILIO_ACCOUNT_SID     — AC...
#   TWILIO_AUTH_TOKEN      — your token
#   ENVIRONMENT            — production
#   PORT                   — 8001
#
# Scaling guidance:
#   worker_count           — set to 5-10 per replica (env var)
#   post_processor_count   — set to 2-3 per replica (env var)
#   outbound_worker_count  — set to 2-3 per replica (env var)
